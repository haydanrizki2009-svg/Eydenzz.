<style>
:root{--bg:#f6f3fb;--ink:#2a2540;--mute:#6d6788;--card:#ffffffcc;--line:#e4def3;--a:#8b7cf6;--b:#ff9ec4;--c:#7fd8c8;--d:#ffd08a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1a2b;--ink:#efeafc;--mute:#a9a2c7;--card:#2a2740cc;--line:#3b3760}}
:root[data-theme="dark"]{--bg:#1c1a2b;--ink:#efeafc;--mute:#a9a2c7;--card:#2a2740cc;--line:#3b3760}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;min-height:100vh;overflow-x:hidden;position:relative}
.blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.45;z-index:0;animation:drift 14s ease-in-out infinite alternate}
.b1{width:340px;height:340px;background:var(--a);top:-90px;left:-80px}
.b2{width:300px;height:300px;background:var(--b);bottom:-80px;right:-60px;animation-delay:-5s}
.b3{width:220px;height:220px;background:var(--c);top:45%;left:60%;animation-delay:-9s;opacity:.3}
@keyframes drift{to{transform:translate(40px,30px) scale(1.12)}}
main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:56px 20px 48px;text-align:center}
.hi{display:inline-block;font-size:44px;animation:wave 2.4s ease-in-out infinite;transform-origin:70% 70%}
@keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(16deg)}20%,40%{transform:rotate(-10deg)}50%{transform:rotate(8deg)}}
h1{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:clamp(34px,9vw,52px);line-height:1.05;margin:10px 0 10px;letter-spacing:-.02em;background:linear-gradient(90deg,var(--a),var(--b),var(--a));background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:200% center}}
.sub{color:var(--mute);margin:0 0 30px}
nav{display:grid;grid-template-columns:1fr 1fr;gap:12px}
nav a{display:flex;align-items:center;justify-content:center;gap:10px;padding:16px 12px;border-radius:18px;background:var(--card);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:500;backdrop-filter:blur(8px);transition:transform .25s cubic-bezier(.3,1.6,.5,1),border-color .2s}
nav a:hover,nav a:focus-visible{transform:translateY(-4px) rotate(-1.5deg);border-color:var(--a);outline:none}
nav a:active{transform:scale(.96)}
nav svg{width:22px;height:22px;flex:none}
.ig svg{color:#e1306c}.tt svg{color:var(--ink)}.wa svg{color:#25a77a}.sp svg{color:#1db954}
.qr{margin-top:28px;padding:16px;border-radius:22px;background:var(--card);border:1px solid var(--line);backdrop-filter:blur(8px)}
.qr h2{font-family:'Bricolage Grotesque',sans-serif;font-size:20px;margin:0 0 12px}
.qr img{width:100%;max-width:340px;height:auto;border-radius:14px;display:block;margin:0 auto;animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.pop{position:fixed;z-index:0;font-size:26px;opacity:.7;animation:float 7s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-22px) rotate(10deg)}}
@media (max-width:380px){nav{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
